  <main class="content tl-page">
    <div class="top">
      <h1>🗺 世界历史时间轴</h1>
      <p class="sub">拖动时间轴，看历史在世界地图上一个个冒出来。经济是第一批住户，政治、战争、科技、文化随后拎包入住。</p>
    </div>

    <div class="tl-filters" id="tl-filters">
      <button data-cat="经济" class="tag-pill tl-cat-经济">经济</button>
      <button data-cat="政治" class="tag-pill tl-cat-政治">政治</button>
      <button data-cat="战争" class="tag-pill tl-cat-战争">战争</button>
      <button data-cat="科技" class="tag-pill tl-cat-科技">科技</button>
      <button data-cat="文化" class="tag-pill tl-cat-文化">文化</button>
    </div>

    <div class="tl-map-wrap">
      <svg id="world-map" viewBox="0 0 1000 500" role="img" aria-label="世界地图">
        <g id="tl-land"></g>
        <g id="tl-markers"></g>
      </svg>
      <div class="tl-year-badge"><span id="tl-year">1720</span></div>
      <div class="tl-popup" id="tl-popup" hidden></div>
    </div>

    <div class="tl-controls">
      <button id="tl-play" aria-label="播放时间轴" title="播放">▶</button>
      <div class="tl-slider-wrap">
        <input type="range" id="tl-slider" min="1600" max="2050" step="1" value="1720" aria-label="年份">
        <div class="tl-ticks">
          <span>1600</span><span>1700</span><span>1800</span><span>1900</span><span>2000</span><span>2050</span>
        </div>
      </div>
    </div>

    <div class="tl-now">
      <h3><span id="tl-now-year">1720</span> 年发生了什么</h3>
      <div id="tl-now-list"></div>
    </div>

    <footer>trading-ideas · 世界历史时间轴 · 内容仅作学习交流</footer>
