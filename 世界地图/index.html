<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>世界历史时间轴 · Trading Ideas</title>
<script>(function(){var t;try{t=localStorage.getItem('ti-theme');}catch(e){}if(!t)t=window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';document.documentElement.setAttribute('data-theme',t);})();</script>
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="timeline.css">
<link rel="stylesheet" href="chart.css">
<link rel="stylesheet" href="eras.css">
<link rel="stylesheet" href="scroll.css">
</head>
<body class="tl-immersive">

<!-- 地球舞台:深空铺满视口,球体居中 -->
<div class="tl-stage">
  <div class="tl-globe-wrap">
    <canvas id="tl-canvas" aria-hidden="true"></canvas>
    <div class="tl-atmos" aria-hidden="true"></div>
    <svg id="world-map" viewBox="-120 -120 240 240" role="img"
         aria-label="可拖动旋转的地球，历史事件随年份在球面上点亮">
      <g id="tl-rhumbs"></g>
      <g id="tl-links"></g>
      <g id="tl-flows"></g>
      <g id="tl-waves"></g>
      <g id="tl-markers"></g>
      <g id="tl-particles"></g>
    </svg>
    <div class="tl-popup" id="tl-popup" hidden></div>
  </div>

  <!-- 卷轴:点进国家时从左往右铺开的那张平面地图 -->
  <div class="tl-scroll" id="tl-scroll" hidden aria-hidden="true">
    <div class="tl-scroll-paper" id="tl-scroll-paper">
      <svg class="tl-cmap" id="tl-cmap" viewBox="0 0 800 520" preserveAspectRatio="xMidYMid meet">
        <g id="tl-cmap-sea"></g>
        <g id="tl-cmap-neighbors"></g>
        <path id="tl-cmap-land"></path>
        <g id="tl-cmap-marks"></g>
      </svg>
      <div class="tl-scroll-label"><span id="tl-scroll-name"></span><em id="tl-scroll-sub"></em></div>
    </div>
    <div class="tl-roller start" aria-hidden="true"></div>
    <div class="tl-roller end" id="tl-roller-end" aria-hidden="true"></div>
  </div>
</div>

<!-- 缩放:滚轮和捏合之外,还得有个看得见的入口 -->
<div class="tl-zoom" id="tl-zoom" role="group" aria-label="缩放地球">
  <button id="tl-zoom-in" aria-label="放大" title="放大">+</button>
  <span id="tl-zoom-read" aria-live="polite">1.0×</span>
  <button id="tl-zoom-out" aria-label="缩小" title="缩小">−</button>
</div>

<!-- 摊平用的画布:只在球变成纸的那一秒露面 -->
<canvas class="tl-morph" id="tl-morph" hidden aria-hidden="true"></canvas>

<!-- 回到地球:国家视图里小球下面那行字 -->
<button class="tl-back-globe" id="tl-back-globe" hidden>回到地球</button>

<!-- 顶栏:浮在地图上的玻璃条 -->
<header class="tl-topbar">
  <a class="tl-back" href="../notes.html">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span>读书笔记</span>
  </a>
  <div class="tl-heading">
    <h1>🗺 世界历史时间轴</h1>
    <p>拖动旋转 · 滚轮缩放 · 点国家看卷宗</p>
  </div>
  <div class="tl-topbar-actions">
    <button class="icon-btn" id="theme-toggle" aria-label="切换深色/浅色" title="切换深色/浅色">
      <svg class="icon-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24"><path d="M12 17a5 5 0 1 0 0-10 5 5 0 0 0 0 10zm0-15v2m0 16v2M4.2 4.2l1.4 1.4m12.8 12.8 1.4 1.4M2 12h2m16 0h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
    </button>
    <a class="icon-btn" href="https://github.com/yingliupabot/trading-ideas" target="_blank" rel="noopener" aria-label="GitHub 仓库" title="GitHub 仓库">
      <svg viewBox="0 0 24 24"><path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.55 0-.27-.01-1.17-.02-2.12-3.2.7-3.88-1.36-3.88-1.36-.52-1.33-1.28-1.68-1.28-1.68-1.04-.71.08-.7.08-.7 1.15.08 1.76 1.19 1.76 1.19 1.03 1.76 2.7 1.25 3.36.96.1-.75.4-1.25.72-1.54-2.55-.29-5.23-1.28-5.23-5.68 0-1.26.45-2.28 1.19-3.09-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.18 1.18a11.1 11.1 0 0 1 5.8 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.83 1.19 3.09 0 4.41-2.69 5.38-5.25 5.67.41.35.77 1.05.77 2.12 0 1.53-.01 2.76-.01 3.14 0 .3.2.67.8.55A11.51 11.51 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5z"/></svg>
    </a>
  </div>
</header>

<!-- 右侧事件面板:分类名以文字呈现,兜住低对比度色的可读性 -->
<aside class="tl-panel" id="tl-panel">
  <button class="tl-panel-toggle" id="tl-panel-toggle" aria-expanded="true" aria-controls="tl-panel-body" title="收起/展开">
    <h3 class="tl-title-year"><span id="tl-now-year">1720</span> 年发生了什么</h3>
    <h3 class="tl-title-country">
      <svg class="tl-seal sm" viewBox="0 0 60 60" aria-hidden="true"><path id="tl-seal-path"/></svg>
      <span><span id="tl-country-name"></span><em id="tl-country-sub"></em></span>
    </h3>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <div class="tl-panel-body" id="tl-panel-body">
    <div id="tl-now-list"></div>
    <div id="tl-dossier-body"></div>
  </div>
</aside>

<!-- 词条管理:读和写在同一个页面上,不另开后台 -->
<div class="tl-manage" id="tl-manage" hidden>
  <div class="tl-manage-sheet">
    <button class="tl-sheet-close" id="tl-manage-close" aria-label="关闭">×</button>
    <h2>词条</h2>
    <p class="sub">点状态可以循环切换：点亮 → 在读 → 想读。<br>
      改完导出，粘回 <code>词条/&lt;id&gt;/meta.json</code>，再跑 <code>npm run index</code>。</p>
    <div class="tl-tbl-wrap">
      <table class="tl-tbl"><thead><tr>
        <th style="width:70px">年份</th><th>标题</th><th style="width:78px">时代</th>
        <th style="width:62px">分类</th><th style="width:78px">状态</th>
      </tr></thead><tbody id="tl-tbl-body"></tbody></table>
    </div>

    <div class="tl-new" id="tl-new">
      <div class="row">
        <div><label>标题</label><input id="nf-title" placeholder="伯罗奔尼撒战争"></div>
        <div><label>年份（公元前用负数）</label><input id="nf-year" type="number" placeholder="-431"></div>
      </div>
      <div class="row">
        <div><label>城市</label><input id="nf-city" placeholder="雅典"></div>
        <div><label>国家</label><input id="nf-country" placeholder="希腊"></div>
      </div>
      <div class="row">
        <div><label>纬度</label><input id="nf-lat" type="number" step="0.01" placeholder="37.98"></div>
        <div><label>经度</label><input id="nf-lng" type="number" step="0.01" placeholder="23.73"></div>
      </div>
      <div class="row">
        <div><label>分类</label><select id="nf-cat">
          <option>经济</option><option>政治</option><option>战争</option><option>科技</option><option>文化</option>
        </select></div>
        <div><label>状态</label><select id="nf-status">
          <option>想读</option><option>在读</option><option>点亮</option>
        </select></div>
      </div>
      <label>一句话</label><textarea id="nf-summary" rows="2" placeholder="不懂就先留空，标成「想读」。"></textarea>
    </div>

    <div class="tl-manage-actions">
      <button class="tl-btn" id="tl-new-toggle">+ 新词条</button>
      <button class="tl-btn primary" id="tl-new-add" style="display:none">加进草稿</button>
      <button class="tl-btn" id="tl-export">导出改动</button>
      <button class="tl-btn" id="tl-reset">丢弃草稿</button>
    </div>
    <pre class="tl-export" id="tl-export-out" hidden></pre>
    <p class="tl-manage-hint" id="tl-manage-hint"></p>
  </div>
</div>

<!-- 底部控制坞 -->
<div class="tl-dock">
  <div class="tl-eras" id="tl-eras" role="group" aria-label="选择时代"></div>
  <p class="tl-era-note" id="tl-era-note"></p>
  <div class="tl-filters" id="tl-filters" role="group" aria-label="按分类筛选">
    <button data-cat="经济" class="tag-pill tl-cat-经济">经济</button>
    <button data-cat="政治" class="tag-pill tl-cat-政治">政治</button>
    <button data-cat="战争" class="tag-pill tl-cat-战争">战争</button>
    <button data-cat="科技" class="tag-pill tl-cat-科技">科技</button>
    <button data-cat="文化" class="tag-pill tl-cat-文化">文化</button>
    <span class="tl-filter-sep" aria-hidden="true"></span>
    <button id="tl-flow-toggle" class="tag-pill tl-flow-pill" aria-pressed="true">💸 资金流动</button>
    <button id="tl-link-toggle" class="tag-pill tl-link-pill" aria-pressed="true">🔗 因果链</button>
    <button id="tl-manage-open" class="tag-pill" title="管理词条">✎ 词条</button>
  </div>
  <div class="tl-transport">
    <div class="tl-year-badge"><span id="tl-year">1720</span></div>
    <button id="tl-play" aria-label="播放时间轴" title="播放">▶</button>
    <div class="tl-slider-wrap">
      <input type="range" id="tl-slider" min="1453" max="1760" step="1" value="1720" aria-label="年份">
      <div class="tl-ticks" id="tl-ticks"></div>
    </div>
  </div>
</div>

<script src="map.js"></script>
<script src="词条.js"></script>
<script src="flows.js"></script>
<script src="countries.js"></script>
<script src="eras.js"></script>
<script src="globe.js"></script>
<!-- GSAP 只做动效糖:CDN 直引 pin 版本,不引入构建。
     加载失败时所有动画调用都有 window.gsap 守卫,页面照常工作。 -->
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="scroll.js"></script>
<script src="timeline.js"></script>
<script src="../theme.js"></script>
<script>
/* 面板收起/展开 */
(function () {
  var btn = document.getElementById("tl-panel-toggle");
  var panel = document.getElementById("tl-panel");
  if (!btn || !panel) return;
  /* 窄屏默认收起:一屏放不下球 + 面板 + 控制坞三层,
     先让人看见球,要看清单再拉开 */
  if (window.matchMedia && window.matchMedia("(max-width: 760px)").matches) {
    panel.classList.add("collapsed");
    btn.setAttribute("aria-expanded", "false");
  }
  btn.addEventListener("click", function () {
    var collapsed = panel.classList.toggle("collapsed");
    btn.setAttribute("aria-expanded", collapsed ? "false" : "true");
  });
})();
</script>
</body>
</html>
