<div class="wrap">
  <a class="back" href="index.html">← 回首页</a>
  <header class="top">
    <h1>读书笔记</h1>
    <p>交易与市场相关的书和文章，看到有用的就记一笔</p>
  </header>

  <div class="note-item">
    <h3>📝 第一篇笔记还没写</h3>
    <p>想记的时候直接在这个页面加一段就行：标题 + 几句自己的话 + 出处链接。格式越简单越能坚持。</p>
  </div>

  <h2 class="sec">怎么加笔记</h2>
  <ul class="tight">
    <li>直接编辑 <code>notes.html</code>，复制上面的 <code>note-item</code> 块</li>
    <li>或者在 <code>notes/</code> 目录里按日期建文件，以后统一汇总</li>
  </ul>

  <footer>trading-ideas · 纯静态页面 · 仅作学习记录，不构成投资建议</footer>
